name: Publish image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      promote_digest:
        description: 'Existing verified sha256 digest to promote to latest; leave empty to build'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  app-image:
    if: ${{ !inputs.promote_digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Image tags
        id: image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          STABLE_RELEASE: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        run: |
          commit=$(git rev-parse HEAD)
          image=ghcr.io/mrmohebi/divar-alert
          {
            echo 'tags<<EOF'
            echo "$image:sha-$commit"
            if [ -n "$RELEASE_TAG" ]; then
              echo "$image:$RELEASE_TAG"
            fi
            if [ "$STABLE_RELEASE" = true ]; then
              echo "$image:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: divar-alert:ci-check
      - name: Verify runtime without real bot credentials
        run: python3 scripts/docker-smoke.py divar-alert:ci-check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Record published image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo '### Published image'
            echo "$TAGS"
            echo "Digest: $DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_digest != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified image to latest
        env:
          DIGEST: ${{ inputs.promote_digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid image digest'; exit 1; }
          image=ghcr.io/mrmohebi/divar-alert
          docker buildx imagetools create --tag "$image:latest" "$image@$DIGEST"
          actual=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
          test "$actual" = "$DIGEST"
          echo "Promoted $image:latest to $DIGEST" >> "$GITHUB_STEP_SUMMARY"
