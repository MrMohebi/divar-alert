services:
  app:
#    build: .
    image: ghcr.io/mrmohebi/divar-alert:latest
    container_name: divar-alert-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_API_URL=https://tapi.bale.ai
      - DB_PATH=/root/app/data/divar-alert.db
      - POLL_INTERVAL_SECONDS=1
    volumes:
      - ./data:/root/app/data
