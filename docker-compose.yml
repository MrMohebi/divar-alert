services:
  app:
    image: ghcr.io/mrmohebi/divar-alert:${DIVAR_IMAGE_TAG:?Set DIVAR_IMAGE_TAG to a published image tag}
    container_name: divar-alert-bot
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      DB_PATH: /root/app/data/divar-alert.db
    volumes:
      - ./data:/root/app/data
